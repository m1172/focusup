# Production backend. This is a paid compute plan; review its current price
# before creating the service. Render provides the HTTPS onrender.com address.
services:
  - type: web
    name: focusup-api
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: AUTH_REDIRECT_URL
        value: focusup://auth/callback
      # Enable providers only after their credentials are configured in Supabase.
      - key: AUTH_OAUTH_PROVIDERS
        value: ""
      # Native apps do not need CORS. Add exact origins if releasing a web app.
      - key: CORS_ORIGINS
        value: ""
      # Set to the verified ingress proxy IP/CIDR before public release.
      - key: TRUST_PROXY
        sync: false
