<!doctype html>
<html lang="en">
  <body style="font-family:system-ui,sans-serif;color:#1c1630;background:#f7f5fc;padding:24px">
    <main style="max-width:480px;margin:auto;background:white;padding:28px;border-radius:20px">
      <h1>Reset your FocusUp password</h1>
      <p>Enter this recovery code in the FocusUp app, then choose a new password:</p>
      <p style="font-size:32px;font-weight:700;letter-spacing:6px">{{ .Token }}</p>
      <p>If you did not request a password reset, ignore this email. Your password will stay the same.</p>
    </main>
  </body>
</html>
