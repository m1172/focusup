project_id = "focusup"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["focusup://auth/callback"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Your FocusUp confirmation code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Your FocusUp password recovery code"
content_path = "./supabase/templates/recovery.html"

# Supabase's built-in mailer only delivers to project-team addresses (~2 emails/hour),
# so public sign-up codes need a real provider. Values come from supabase/.env (see .env.example).
[auth.email.smtp]
enabled = true
host = "env(SUPABASE_AUTH_SMTP_HOST)"
port = 465
user = "env(SUPABASE_AUTH_SMTP_USER)"
pass = "env(SUPABASE_AUTH_SMTP_PASS)"
admin_email = "env(SUPABASE_AUTH_SMTP_ADMIN_EMAIL)"
sender_name = "FocusUp"

[auth.rate_limit]
# Emails per hour across the project; only adjustable once custom SMTP is on.
email_sent = 30

[functions.focusup-api]
# Login, refresh and health are public. The handler verifies every private route
# using Auth.getUser(), and all account queries still use the user's RLS token.
verify_jwt = false
entrypoint = "./functions/focusup-api/index.ts"
