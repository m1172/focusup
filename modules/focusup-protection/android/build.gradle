plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.focusupprotection'
version = '1.0.0'
android {
  namespace 'expo.modules.focusupprotection'
  defaultConfig { minSdkVersion 24; versionCode 1; versionName '1.0.0' }
}

dependencies {
  implementation 'androidx.webkit:webkit:1.15.0'
  testImplementation 'junit:junit:4.13.2'
}
